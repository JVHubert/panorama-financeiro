# Publica o painel no GitHub Pages a cada merge na main.
# Endereço: https://jvhubert.github.io/panorama-financeiro/
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# Desde 19/10/2026 o JV11 News orquestra as mensagens: os alertas deste workflow ficam guardados na
# Cloudflare e aparecem na mensagem do dia, em vez de chegarem sozinhos no Telegram.
env:
  ALERTAS_URL: ${{ secrets.ALERTAS_URL }}
  ALERTAS_SEGREDO: ${{ secrets.ALERTAS_SEGREDO }}

permissions:
  contents: read
  actions: read # o alerta descobre em que passo parou
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir as contas
        run: npm test
      - name: Montar o site
        run: node tools/publicar.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Falhou a montagem ou a publicação: avisa no Telegram onde parou.
  alerta:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avisar no Telegram que falhou
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/alertar.mjs
