# O bot tem que ser rápido: você espera a correção do /r, e o Telegram só guarda mensagem não lida
# por 24 h. Este workflow não roda testes nem mexe no site — só lê o que chegou, anota e salva.
name: Telegram

on:
  schedule:
    - cron: '*/20 * * * *' # a cada 20 minutos
  workflow_dispatch:

# Desde 19/10/2026 o JV11 News orquestra as mensagens: os alertas deste workflow ficam guardados na
# Cloudflare e aparecem na mensagem do dia, em vez de chegarem sozinhos no Telegram.
env:
  ALERTAS_URL: ${{ secrets.ALERTAS_URL }}
  ALERTAS_SEGREDO: ${{ secrets.ALERTAS_SEGREDO }}

permissions:
  contents: read
  actions: read # o vigia e o alerta leem as execuções dos workflows

# Mesmo grupo dos outros que salvam no repositório privado: um push de cada vez.
concurrency:
  group: privado
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar os dados privados
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: JVHubert/panorama-financeiro-dados
          token: ${{ secrets.DADOS_TOKEN }}
          path: privado

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ler o que chegou no Telegram
        if: hashFiles('privado/carteira.json') != ''
        env:
          DADOS_DIR: privado/
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # O bot é compartilhado com o JV11 News: as mensagens do Panorama chegam por esta fila.
          TELEGRAM_FILA_URL: ${{ secrets.TELEGRAM_FILA_URL }}
          TELEGRAM_FILA_SEGREDO: ${{ secrets.TELEGRAM_FILA_SEGREDO }}
        run: node tools/telegram.mjs

      # O vigia confere se o relatório de domingo e a coleta diária rodaram de fato, e avisa uma vez
      # só por problema (o que já foi avisado fica em alertas.json, nos dados privados).
      - name: Vigiar os outros workflows
        if: hashFiles('privado/carteira.json') != ''
        continue-on-error: true
        env:
          DADOS_DIR: privado/
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/vigia.mjs

      - name: Guardar no repositório privado
        if: hashFiles('privado/carteira.json') != ''
        run: |
          set -euo pipefail
          cd privado
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nada novo no repositório privado"
            exit 0
          fi
          git commit -m "dados: anotado pelo Telegram"
          git pull --rebase
          git push

      # Falhou qualquer passo acima: avisa no Telegram onde parou e o que costuma ser.
      - name: Avisar no Telegram que falhou
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/alertar.mjs
